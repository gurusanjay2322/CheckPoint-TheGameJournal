version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: checkpoint
      POSTGRES_USER: checkpoint
      POSTGRES_PASSWORD: checkpoint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkpoint -d checkpoint"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://checkpoint:checkpoint@postgres:5432/checkpoint?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PORT: "3000"
      STEAM_API_KEY: ${STEAM_API_KEY}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_SECRET: ${IGDB_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      APP_REDIRECT_URL: ${APP_REDIRECT_URL:-checkpoint://auth}

  worker:
    build: .
    command: ["./worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://checkpoint:checkpoint@postgres:5432/checkpoint?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PORT: "3000"
      STEAM_API_KEY: ${STEAM_API_KEY}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_SECRET: ${IGDB_SECRET}
      JWT_SECRET: ${JWT_SECRET}

volumes:
  pgdata:
