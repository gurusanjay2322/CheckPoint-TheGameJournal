basePath: /api/v1
definitions:
  handlers.CreateReviewRequest:
    properties:
      contains_spoiler:
        type: boolean
      content:
        type: string
      game_title:
        type: string
      igdb_id:
        type: integer
      rating:
        maximum: 5
        minimum: 0
        type: number
    required:
    - igdb_id
    type: object
  handlers.EmailLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.SignupRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - email
    - password
    - username
    type: object
  handlers.UpdateEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.UpdateLibraryRequest:
    properties:
      game_title:
        type: string
      igdb_id:
        type: integer
      status:
        type: string
    required:
    - igdb_id
    - status
    type: object
  handlers.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      username:
        maxLength: 50
        minLength: 2
        type: string
    type: object
  handlers.UpdateReviewRequest:
    properties:
      contains_spoiler:
        type: boolean
      content:
        type: string
      rating:
        maximum: 5
        minimum: 0
        type: number
    type: object
  models.Game:
    properties:
      cover_url:
        type: string
      created_at:
        type: string
      id:
        type: string
      igdb_id:
        type: integer
      release_date:
        type: string
      steam_app_id:
        description: Used to map imported games
        type: integer
      summary:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.Review:
    properties:
      contains_spoiler:
        type: boolean
      content:
        type: string
      created_at:
        type: string
      game:
        $ref: '#/definitions/models.Game'
      game_id:
        type: string
      id:
        type: string
      rating:
        description: 0-5 stars
        type: number
      updated_at:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: string
    type: object
  models.User:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      steam_id:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: The Game Journal (Letterboxd for games) API
  title: Checkpoint MVP API
  version: "1.0"
paths:
  /auth/email:
    put:
      consumes:
      - application/json
      description: Update the user's email address
      parameters:
      - description: Update Email Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update Email
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user using email and password
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.EmailLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Traditional Login
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Get the currently authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get Current User
      tags:
      - auth
  /auth/profile:
    put:
      consumes:
      - application/json
      description: Update the current user's profile (username, bio, avatar)
      parameters:
      - description: Update Profile Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update Profile
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Register a new user with email and password
      parameters:
      - description: Signup Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SignupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Traditional Signup
      tags:
      - auth
  /auth/steam/callback:
    get:
      description: Called by Steam after sign-in. Verifies the assertion with Steam,
        then logs in or links the account and redirects to APP_REDIRECT_URL.
      responses:
        "302":
          description: Found
      summary: Steam OpenID callback
      tags:
      - auth
  /auth/steam/link:
    post:
      description: Returns a Steam sign-in URL for the current user. Open it in a
        browser; after sign-in, /auth/steam/callback links the account, starts a library
        sync and redirects to APP_REDIRECT_URL with `linked=true` (or `error`).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Start linking a Steam account
      tags:
      - auth
  /auth/steam/login:
    get:
      description: Redirects the browser to Steam sign-in. After Steam authenticates
        the user, /auth/steam/callback redirects to APP_REDIRECT_URL with `token`
        (or `error`).
      responses:
        "302":
          description: Found
      summary: Login/Signup with Steam
      tags:
      - auth
  /games/{id}:
    get:
      consumes:
      - application/json
      description: Fetch detailed information for a specific game by its IGDB ID
      parameters:
      - description: IGDB Game ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Game by ID
      tags:
      - games
  /games/discover:
    get:
      consumes:
      - application/json
      description: Fetch popular mainstream games (All time)
      parameters:
      - description: Limit (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Discover Games
      tags:
      - games
  /games/new-releases:
    get:
      consumes:
      - application/json
      description: Fetch newly released games
      parameters:
      - description: Limit (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: New Releases
      tags:
      - games
  /games/search:
    get:
      consumes:
      - application/json
      description: Search for games on IGDB
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Limit (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search Games
      tags:
      - games
  /games/trending:
    get:
      consumes:
      - application/json
      description: Fetch currently trending games
      parameters:
      - description: Limit (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trending Games
      tags:
      - games
  /library/{game_id}:
    delete:
      consumes:
      - application/json
      description: Remove a game from the user's library
      parameters:
      - description: Game UUID
        in: path
        name: game_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove Game from Library
      tags:
      - library
  /library/{user_id}:
    get:
      consumes:
      - application/json
      description: Fetch all games in a user's library
      parameters:
      - description: User UUID
        in: path
        name: user_id
        required: true
        type: string
      - description: Filter by status (playing, completed, backlog, dropped, wishlist)
        in: query
        name: status
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get User Library
      tags:
      - library
  /library/update:
    post:
      consumes:
      - application/json
      description: Add a game to library or update its status
      parameters:
      - description: Update Status Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateLibraryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update Game Status
      tags:
      - library
  /reviews:
    post:
      consumes:
      - application/json
      description: Write a review and rate a game
      parameters:
      - description: Create Review Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Review'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a Review
      tags:
      - reviews
  /reviews/{id}:
    delete:
      consumes:
      - application/json
      description: Delete your review for a game
      parameters:
      - description: Review UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a Review
      tags:
      - reviews
    put:
      consumes:
      - application/json
      description: Update your review for a game
      parameters:
      - description: Review UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update Review Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Review'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a Review
      tags:
      - reviews
  /reviews/game/{igdb_id}:
    get:
      consumes:
      - application/json
      description: Get all reviews for a specific game by IGDB ID
      parameters:
      - description: IGDB ID
        in: path
        name: igdb_id
        required: true
        type: integer
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
