      - reviews
  /reviews/user/{user_id}:
    get:
      consumes:
      - application/json
      description: Get all reviews made by a specific user
      parameters:
      - description: User UUID
        in: path
        name: user_id
        required: true
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
